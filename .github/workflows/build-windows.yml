name: Build Windows EXE

# Сборка RDPConnectionMonitor.exe на Windows-раннере GitHub.
#  * push / pull request в main — тесты + EXE в артефактах запуска (Actions → запуск → Artifacts)
#  * тег vX.Y.Z (git tag v1.0.0 && git push origin v1.0.0) — дополнительно GitHub Release с EXE
#  * вручную: Actions → Build Windows EXE → Run workflow

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + PyInstaller (windows-latest, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Probe real Windows APIs (runner session, informational)
        continue-on-error: true
        shell: pwsh
        run: |
          python main.py --probe
          Get-Content "$env:LOCALAPPDATA\RDPConnectionMonitor\probe.txt" -ErrorAction SilentlyContinue

      - name: Build portable EXE (onefile)
        run: python -m PyInstaller --noconfirm --clean rdp_monitor.spec

      - name: Build folder version (onedir, for AppLocker-restricted PCs)
        shell: pwsh
        env:
          RDPMON_ONEDIR: "1"
        run: |
          python -m PyInstaller --noconfirm --distpath dist-onedir --workpath build-onedir rdp_monitor.spec
          Compress-Archive -Path dist-onedir\RDPConnectionMonitor\* -DestinationPath dist\RDPConnectionMonitor-onedir.zip -Force

      - name: Verify EXE (manifest asInvoker, size, smoke --probe)
        shell: pwsh
        run: |
          $exe = "dist\RDPConnectionMonitor.exe"
          if (-not (Test-Path $exe)) { throw "EXE not found" }
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($text -notmatch 'level="asInvoker"') { throw "asInvoker manifest not found" }
          if ($text -match 'requireAdministrator|highestAvailable') { throw "elevation requested in manifest" }
          "Manifest OK (asInvoker)"
          "Size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
          # запуск собранного EXE в режиме --probe: проверяет, что EXE стартует и пишет отчёт
          Remove-Item "$env:LOCALAPPDATA\RDPConnectionMonitor\probe.json" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--probe" -PassThru -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\RDPConnectionMonitor\probe.json")) { throw "EXE --probe did not produce probe.json (exit $($p.ExitCode))" }
          "EXE --probe OK"
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist\RDPConnectionMonitor.exe.sha256
          Get-Content dist\RDPConnectionMonitor.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RDPConnectionMonitor-${{ github.sha }}
          path: |
            dist/RDPConnectionMonitor.exe
            dist/RDPConnectionMonitor.exe.sha256
            dist/RDPConnectionMonitor-onedir.zip
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RDPConnectionMonitor-${{ github.sha }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RDPConnectionMonitor.exe
            dist/RDPConnectionMonitor.exe.sha256
            dist/RDPConnectionMonitor-onedir.zip
          generate_release_notes: true
